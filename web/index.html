<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remora — Your laptop, in your pocket</title>
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121821;
      --border: #1f2a37;
      --text: #e6edf3;
      --muted: #8b98a5;
      --accent: #2dd4bf;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      background: rgba(45, 212, 191, 0.1);
      color: var(--accent);
      border: 1px solid rgba(45, 212, 191, 0.25);
      border-radius: 9999px;
      padding: 0.25rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .links a {
      display: inline-block;
      background: var(--accent);
      color: var(--bg);
      font-weight: 600;
      text-decoration: none;
      padding: 0.6rem 1.25rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      transition: opacity 0.15s;
    }
    .links a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Desktop Preview Available</div>
    <h1>Remora</h1>
    <p>Your laptop, in your pocket. The desktop client connects your machine via encrypted Cloudflare tunnels with local audit logging and permission controls.</p>
    <div class="links">
      <a href="https://github.com/chadixearth/remora" target="_blank" rel="noopener">View GitHub Repository</a>
    </div>
  </div>
</body>
</html>
